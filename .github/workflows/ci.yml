name: CI

on:
  pull_request:
  push:
    branches: [ realease ]
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e .

      - name: Import test
        run: |
          python - << 'EOF'
          import nobi_dl
          import nobi_dl.extractors
          print("IMPORT OK")
          EOF

      - name: Compile check
        run: |
          python -m compileall nobi_dl
